name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release package
        run: |
          mkdir -p ShopwareWebhookConnector
          cp -r src composer.json LICENSE README.md ShopwareWebhookConnector/
          zip -r ShopwareWebhookConnector-${{ steps.version.outputs.VERSION }}.zip ShopwareWebhookConnector

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ShopwareWebhookConnector-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
